name: Keep Render backend awake

on:
  schedule:
    # Run every 10 minutes; GitHub may delay scheduled jobs during busy periods.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error --max-time 25 --retry 2 --retry-delay 3 \
            https://drop-eyr8.onrender.com/health
